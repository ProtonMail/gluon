---
govulncheck:
  stage: check
  extends:
    - .image-linux-test
    - .rules-MR-and-dev-always
  timeout: 10m
  script:
    - ./ci/govulncheck.sh
  artifacts:
    when: always
    paths:
      - vulns*
  tags:
    - shared-medium

test-linux:
  stage: test
  extends:
    - .image-linux-test
    - .rules-MR-and-dev-always
  timeout: 30m
  script:
    - export PATH="$(go env GOPATH)/bin:$PATH"
    - bash utils/install_gotestsum.sh
    - bash ci/test.sh linux
    - bash ci/test_race.sh linux
  artifacts:
    when: always
    paths:
      - test-linux*.xml
    reports:
      junit: test-linux*.xml
  tags:
    - shared-large

test-darwin:
  stage: test
  extends:
    - .image-darwin-build
    - .rules-MR-and-dev-always
  timeout: 30m
  before_script:
    - source ~/.zprofile
    - export GOROOT=/opt/go/1.26.1
    - export PATH="${GOROOT}/bin:$PATH"
    - export GOPATH="$CI_PROJECT_DIR/.cache"
    - export PATH="${GOPATH}/bin:$PATH"
    - mkdir -p .cache/bin
    - bash utils/install_gotestsum.sh
  script:
    - bash ci/test.sh darwin
    - bash ci/test_race.sh darwin
  artifacts:
    when: always
    paths:
      - test-darwin*.xml
    reports:
      junit: test-darwin*.xml
  cache:
    key: darwin-go-modules
    paths:
      - .cache
    when: always

test-windows:
  stage: test
  extends:
    - .image-windows-virt-build
    - .rules-MR-and-dev-always
  timeout: 20m
  before_script:
    - !reference [.before-script-windows-virt-build, before_script]
    - mkdir -p .cache/bin
    - export PATH=$(pwd)/.cache/bin:$PATH
    - export GOPATH="$CI_PROJECT_DIR/.cache"
    - bash utils/install_gotestsum.sh
  script:
    - bash ci/test.sh windows
  artifacts:
    when: always
    paths:
      - test-windows*.xml
    reports:
      junit: test-windows*.xml
  cache:
    key: windows-go-modules
    paths:
      - .cache
    when: always
