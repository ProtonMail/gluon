failOnOutOfDiff: true
scanners:
  golangci-lint:
    enable: false
  gofmt:
    enable: false
  shellcheck:
    enable: true
  gomodcheck:
    enable: true
  grype:
    minSeverity: error
    ignoreRules:
      - "GO-2026-5970"  # BRIDGE-638 — x/text norm.Iter infinite loop on invalid UTF-8 (uses x/text/encoding, not norm)
    # Convention: each ignored rule gets a JIRA ticket and reason
    #   - "GHSA-xxxx-yyyy"  # BRIDGE-NNNN — brief reason / remediation status
